[pytest]
# Configuração do pytest para DOC2PDF API
# Versão: 1.5.2

# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Capture output
    --capture=no
    # Show summary of all test outcomes
    -ra
    # Strict markers (erro se marker não definido)
    --strict-markers
    # Warnings como erros (opcional, comentar se muito restritivo)
    # -W error
    # Coverage report
    --cov=app
    --cov=config
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Parallel execution (descomente para executar em paralelo)
    # -n auto

# Markers personalizados
markers =
    unit: Testes unitários (isolados, sem dependências)
    integration: Testes de integração (requerem dependências externas)
    slow: Testes lentos (> 1 segundo)
    api: Testes de endpoints da API
    service: Testes de serviços
    validator: Testes de validadores
    encoder: Testes de encoders
    conversion: Testes de conversão DOCX->PDF
    error: Testes de tratamento de erros
    performance: Testes de performance
    skip_ci: Testes que devem ser pulados em CI

# Configurações de cobertura
[coverage:run]
source = app,config
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */test_*.py
branch = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Ignora linhas pragma
    pragma: no cover
    # Ignora definições abstratas
    def __repr__
    def __str__
    # Ignora condições de debug
    if __name__ == .__main__.:
    if settings.DEBUG
    # Ignora NotImplementedError
    raise NotImplementedError
    # Ignora pass
    pass
    # Ignora ellipsis
    \.\.\.

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
